services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      STAGE_DATA_DIR: /data
    volumes:
      - stage-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  preview-worker:
    profiles: ["preview"]
    build: .
    restart: unless-stopped
    command: ["python", "-m", "stagegen.worker"]
    env_file: .env
    environment:
      STAGE_BACKEND: preview
      STAGE_API_URL: http://api:8000
      STAGE_WORK_DIR: /tmp/worker
    depends_on:
      api:
        condition: service_healthy
volumes:
  stage-data:
